name: check

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - run: npm run validate
      - run: npm test
      # Zips are reproducible: rebuilding must not change any published file.
      - run: npm run pack && git diff --exit-code -- dist/
      - run: npm run index -- --check
